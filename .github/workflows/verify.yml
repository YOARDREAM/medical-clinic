name: PostgreSQL integration
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL and Flask
        run: docker compose up --build --wait
      - name: Verify forms and database constraints
        run: python3 scripts/verify.py
      - name: Capture the running application
        run: |
          mkdir -p screenshots
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --disable-gpu \
            --window-size=1300,780 --user-data-dir="$RUNNER_TEMP/clinic-home" \
            --screenshot="$PWD/screenshots/clinic-home.png" http://127.0.0.1:8000/
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --disable-gpu \
            --window-size=1300,780 --user-data-dir="$RUNNER_TEMP/clinic-edit" \
            --screenshot="$PWD/screenshots/clinic-edit.png" http://127.0.0.1:8000/t/appointments/3/edit
      - name: Save browser screenshots
        uses: actions/upload-artifact@v4
        with:
          name: clinic-screenshots
          path: screenshots/*.png
          if-no-files-found: error
      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --no-color
